<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe AI</title>
    <meta name="description" content="Play against an unbeatable Tic-Tac-Toe AI powered by Minimax.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="slider-container">
            <div class="slider" id="slider">
                <!-- Screen 1: Mode Selection -->
                <div class="screen" id="screen-1">
                    <div class="icon-large">🤖</div>
                    <h2>Game Mode</h2>
                    <p class="subtitle">Who are you playing against?</p>
                    <button class="menu-btn" id="btn-agent">Single Player (vs AI)</button>
                    <button class="menu-btn" id="btn-multi">Multiplayer (Local)</button>
                </div>

                <!-- Screen 2: Player Selection -->
                <div class="screen" id="screen-2">
                    <div class="icon-large">🤔</div>
                    <h2>Choose Your Side</h2>
                    <p class="subtitle">Who goes first?</p>
                    <button class="menu-btn" id="btn-choose-x">Play as X (1st)</button>
                    <button class="menu-btn" id="btn-choose-o">Play as O (2nd)</button>
                    <button class="back-btn" id="back-to-1">⬅ Back to Modes</button>
                </div>

                <!-- Screen 3: The Game -->
                <div class="screen" id="screen-3">
                    <header>
                        <h1>Tic-Tac-Toe</h1>
                        <p class="subtitle" id="game-subtitle">vs AI</p>
                    </header>

                    <div class="scoreboard">
                        <div class="score-box">
                            <span id="score-label-x">Player X</span>
                            <strong id="score-x">0</strong>
                        </div>
                        <div class="score-box">
                            <span>Draws</span>
                            <strong id="score-draws">0</strong>
                        </div>
                        <div class="score-box">
                            <span id="score-label-o">Player O</span>
                            <strong id="score-o">0</strong>
                        </div>
                    </div>

                    <div class="status-panel">
                        <div id="status-text">Your Turn (X)</div>
                    </div>

                    <div class="board" id="board">
                        <div class="cell" data-index="0" id="cell-0"></div>
                        <div class="cell" data-index="1" id="cell-1"></div>
                        <div class="cell" data-index="2" id="cell-2"></div>
                        <div class="cell" data-index="3" id="cell-3"></div>
                        <div class="cell" data-index="4" id="cell-4"></div>
                        <div class="cell" data-index="5" id="cell-5"></div>
                        <div class="cell" data-index="6" id="cell-6"></div>
                        <div class="cell" data-index="7" id="cell-7"></div>
                        <div class="cell" data-index="8" id="cell-8"></div>
                    </div>

                    <div class="game-controls">
                        <button class="back-btn" id="back-to-2">⬅ Back</button>
                        <button id="reset-score-btn" class="btn secondary">Reset Score</button>
                        <button id="restart-btn" class="btn">Restart Game</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
